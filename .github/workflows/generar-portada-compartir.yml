name: Crear miniatura para compartir
on:
  push:
    paths:
      - ".github/workflows/generar-portada-compartir.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portada:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
      - name: Instalar generador
        run: python -m pip install --quiet Pillow CairoSVG
      - name: Diseñar miniatura 1200x630 para WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          import cairosvg

          W, H = 1200, 630
          photo = Image.new("RGB", (W, H))
          px = photo.load()
          for y in range(H):
              t = y/(H-1)
              for x in range(W):
                  mix = .63*t+.37*(x/W)
                  px[x,y] = (
                      int(49*(1-mix)+99*mix),
                      int(62*(1-mix)+102*mix),
                      int(111*(1-mix)+162*mix)
                  )
          img = photo.convert("RGBA")
          d = ImageDraw.Draw(img)
          for i in range(15, 0, -1):
              d.rounded_rectangle([24+i//4, 20+i//3, W-24+i//4, H-20+i//3], radius=24, fill=(40,39,77,3))
          d.rounded_rectangle([33, 27, 1167, 603], radius=19, fill=(255,250,247,255))
          d.rounded_rectangle([51, 45, 1149, 585], radius=15, outline=(220,185,198,210), width=2)
          d.rounded_rectangle([62, 56, 1138, 574], radius=12, outline=(232,217,224,255), width=1)

          flora_png = cairosvg.svg2png(url="assets/floral-vivo.svg", output_width=430, output_height=545)
          flora = Image.open(BytesIO(flora_png)).convert("RGBA")
          left = flora.rotate(13, resample=Image.Resampling.BICUBIC, expand=True)
          img.alpha_composite(left, (-115, 135))
          right = ImageOps.mirror(flora).rotate(-13, resample=Image.Resampling.BICUBIC, expand=True)
          img.alpha_composite(right, (W-420, -115))

          d = ImageDraw.Draw(img)
          font_base = Path("/usr/share/fonts/truetype/dejavu")
          def font(filename, size):
              p = font_base / filename
              return ImageFont.truetype(str(p), size) if p.exists() else ImageFont.load_default()
          serif = font("DejaVuSerif.ttf", 68)
          italic = font("DejaVuSerif-Italic.ttf", 47)
          small = font("DejaVuSans.ttf", 18)
          tiny = font("DejaVuSans.ttf", 15)
          title = font("DejaVuSerif.ttf", 33)
          navy=(60,72,124,255)
          rose=(190,117,135,255)
          muted=(119,108,139,255)
          peach=(211,163,148,255)
          def center(label, yy, f, color, spacing=0):
              if not spacing:
                  d.text((600,yy), label, fill=color, font=f, anchor="mm")
              else:
                  widths=[d.textlength(ch,font=f) for ch in label]
                  total=sum(widths)+spacing*(len(label)-1)
                  pos=600-total/2
                  for ch,w in zip(label,widths):
                      d.text((pos,yy), ch, fill=color, font=f, anchor="lm")
                      pos+=w+spacing
          center("UNA INVITACIÓN ESPECIAL", 156, small, muted, 4)
          center("Nuestra boda", 214, title, rose)
          center("Novia", 296, serif, navy)
          center("&", 355, italic, rose)
          center("Novio", 424, serif, navy)
          d.line([(450,485),(530,485)], fill=peach, width=2)
          d.polygon([(600,475),(608,485),(600,495),(592,485)], fill=rose)
          d.line([(670,485),(750,485)], fill=peach, width=2)
          center("31  ·  DICIEMBRE  ·  2026", 525, tiny, navy, 2)
          out = Path("assets/portada-compartir.jpg")
          img.convert("RGB").save(out, "JPEG", quality=86, optimize=True, progressive=False, subsampling=0)
          print(f"Generada {out} ({out.stat().st_size:,} bytes)")
          if not (50000 < out.stat().st_size < 800000):
              raise RuntimeError("El archivo generado tiene un tamaño inesperado")
          PY
      - name: Guardar nueva portada
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portada-compartir.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: agregar vista previa floral de boda para WhatsApp"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
